[package]
name = "gravity-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Node.js bindings for the Gravity AI gateway (napi-rs)."

[lib]
name = "gravity_node"
crate-type = ["cdylib", "rlib"]

[dependencies]
gravity-core.workspace = true
gravity-providers.workspace = true
gravity-client.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
